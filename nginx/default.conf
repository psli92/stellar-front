# Docker DNS is re-resolved when sk-route is recreated.
upstream sk_router {
    zone sk_router 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server sk-route:80 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 52m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = /health/ready { access_log off; return 200 'ready'; }
    location = /api { return 308 /api/; }
    # Never expose internal callbacks through this ingress.
    location ~ ^/api/(?:internal|_router)(?:/|$) { return 404; }
    location /api/ {
        proxy_pass http://sk_router/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Only the caller's token. No service identity is stored or injected here.
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_cache off;
        proxy_hide_header X-Powered-By;
    }
    location ~ /\. { return 404; }
    location /assets/ { try_files $uri =404; expires -1; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
}
