<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stellar</title>
  <link rel="stylesheet" href="/assets/site.css">
  <script type="module" src="/assets/main.mjs"></script>
</head>
<body>
  <header><a class="brand" href="/" aria-label="Stellar, accueil">STELLAR<span>✦</span></a>
    <label>Langue <select id="language" aria-label="Langue"><option value="FR">Français</option><option value="EN">English</option></select></label>
  </header>
  <main>
    <p class="eyebrow">VOTRE ESPACE STELLAR</p>
    <h1 id="title">Bienvenue.</h1>
    <p id="intro">Nous préparons votre espace.</p>
    <p id="status" role="status" aria-live="polite">Chargement…</p>
    <button id="retry" type="button" hidden>Réessayer</button>
    <noscript>Activez JavaScript pour accéder à votre espace.</noscript>
  </main>
  <footer>Stellar <span>0.0.1 · Première étape du nouveau front</span></footer>
</body>
</html>
